<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found — Sanjeev Sharma</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#0a0a0b; --text:#edebe6; --text-2:#a3a19b; --line:rgba(237,235,230,.14); --accent:#5b8cff; color-scheme:dark; }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100svh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; padding:24px 16px; }
  main { width:100%; max-width:720px; }
  .eyebrow { font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  h1 { font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:clamp(5rem,22vw,11rem); letter-spacing:-.06em; line-height:.9; margin:18px 0 8px;
       color:transparent; -webkit-text-stroke:1.2px rgba(237,235,230,.55); animation:rise 1s cubic-bezier(.22,1,.36,1) both; }
  p { color:var(--text-2); font-size:1.1rem; max-width:40ch; line-height:1.6; animation:rise 1s .1s cubic-bezier(.22,1,.36,1) both; }
  a { display:inline-flex; align-items:center; gap:10px; margin-top:32px; height:50px; padding:0 24px; border-radius:999px; background:var(--text); color:var(--bg);
      text-decoration:none; font-weight:500; transition:background .3s; animation:rise 1s .2s cubic-bezier(.22,1,.36,1) both; }
  a:hover { background:var(--accent); }
  a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  @keyframes rise { from { opacity:0; transform:translateY(24px); } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
</head>
<body>
<main>
  <span class="eyebrow">Error 404 · Signal lost</span>
  <h1>404</h1>
  <p>This page doesn’t exist, or it has moved. The rest of the portfolio is right where it should be.</p>
  <a href="/">Back to the portfolio →</a>
</main>
</body>
</html>
